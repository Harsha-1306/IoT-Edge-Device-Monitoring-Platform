version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotpass}
      POSTGRES_DB: ${POSTGRES_DB:-iot_telemetry}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot} -d ${POSTGRES_DB:-iot_telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    container_name: iot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iotpass}@postgres:5432/${POSTGRES_DB:-iot_telemetry}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-iot/+/telemetry}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FLASK_ENV: production
      TEMP_THRESHOLD: ${TEMP_THRESHOLD:-75}
      LOAD_THRESHOLD: ${LOAD_THRESHOLD:-90}
    ports:
      - "5001:5000"

  simulator:
    build: ./simulator
    container_name: iot_simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DEVICES: ${SIM_DEVICES:-3}
      INTERVAL_SECONDS: ${SIM_INTERVAL:-2}

  frontend:
    build: ./frontend
    container_name: iot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
